<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>できたことログ</title>
  <style>
    :root { --bg:#faf9f7; --card:#fff; --ink:#2c2b29; --sub:#8a8780; --accent:#e8955a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
           background:var(--bg); color:var(--ink); line-height:1.6; }
    .wrap { max-width: 620px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .date { color: var(--sub); font-size: .9rem; margin-bottom: 24px; }
    .cal-link { color: var(--accent); text-decoration: none; margin-left: 8px; }
    .cal-link:hover { text-decoration: underline; }
    form { display: flex; flex-direction: column; gap: 10px; background: var(--card);
           padding: 18px; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    input[type=text] { padding: 12px; border: 1px solid #e3e0da; border-radius: 10px; font-size: 1rem; }
    input[type=text]:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; }
    .row .content { flex: 1; }
    .row .category { width: 130px; }
    button { padding: 12px 18px; border: none; border-radius: 10px; background: var(--accent);
             color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.05); }
    ul { list-style: none; padding: 0; margin: 28px 0 0; }
    li { background: var(--card); padding: 14px 16px; border-radius: 12px; margin-bottom: 10px;
         box-shadow: 0 1px 3px rgba(0,0,0,.04); display: flex; align-items: baseline; gap: 10px; }
    li .tag { font-size: .72rem; color: var(--accent); border: 1px solid var(--accent);
              padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
    li .time { color: var(--sub); font-size: .78rem; margin-left: auto; white-space: nowrap; }
    .empty { color: var(--sub); text-align: center; padding: 32px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>今日できたこと</h1>
    <div class="date">{{ today }} <a class="cal-link" href="/calendar">📅 積み上がりを見る</a></div>

    <form action="/entries" method="post">
      <div class="row">
        <input class="content" type="text" name="content" placeholder="例：洗濯できた / 30分散歩した" autofocus required>
        <input class="category" type="text" name="category" placeholder="カテゴリ（任意）">
      </div>
      <button type="submit">記録する</button>
    </form>

    <ul>
      {% for e in entries %}
      <li>
        {% if e["category"] %}<span class="tag">{{ e["category"] }}</span>{% endif %}
        <span class="text">{{ e["content"] }}</span>
        <span class="time">{{ e["created_at"][11:16] }}</span>
      </li>
      {% else %}
      <li class="empty" style="display:block;">まだ記録がありません。小さなことでも大丈夫です。</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
